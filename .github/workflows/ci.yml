name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build flare-web for WASM
        run: wasm-pack build flare-web --target web
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and test browser SDK
        run: |
          npm ci --prefix flare-web
          npm run build:sdk --prefix flare-web
          npm run test:sdk --prefix flare-web
      - name: Verify packaged ESM syntax, import, and WASM initialization
        run: node .github/scripts/check_wasm_package.mjs /tmp/flare-consumer
      - name: Generate and verify pinned browser fixture
        run: python3 flare-web/tests/browser/make_ci_fixture.py /tmp/flare-consumer
      - name: Install pinned Chromium
        working-directory: flare-web
        run: npx playwright install --with-deps chromium
      - name: Run packaged CPU inference in Chromium without GPU
        run: node flare-web/tests/browser/run.mjs /tmp/flare-consumer
      - name: Verify required-adapter failure reporting
        env:
          BROWSER_ARTIFACTS: browser-artifacts/missing-adapter
        run: |
          if node flare-web/tests/browser/run.mjs /tmp/flare-consumer --gpu --disable-adapter; then
            echo "Required-adapter negative test unexpectedly passed"
            exit 1
          fi
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const r = JSON.parse(fs.readFileSync('browser-artifacts/missing-adapter/result.json')); assert.equal(r.passed, false); assert.match(r.result?.error?.message ?? '', /Required WebGPU (API|adapter) unavailable/);"
      - name: Save browser results and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-cpu-${{ github.run_attempt }}
          path: browser-artifacts/
          if-no-files-found: warn

  doc:
    name: Doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (no push)
        run: docker build --tag flare-server:ci .
